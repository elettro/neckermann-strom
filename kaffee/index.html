<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="description" content="Interne Neckermann Strom Kaffee- und Messestand-Galerie.">
  <title>Kaffee | Neckermann Strom</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .kaffee-hero{padding:68px 0 38px;background:linear-gradient(135deg,#f7f7ef,#eaf4ec);border-bottom:1px solid rgba(2,63,44,.08)}
    .kaffee-hero h1{margin:.12em 0;font-size:clamp(48px,7vw,92px);letter-spacing:-.055em;line-height:.92;color:#06442f}
    .kaffee-hero p{max-width:820px;font-size:20px;line-height:1.55;color:#476057}
    .kicker{font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#0a8d36}
    .kaffee-gallery{padding:54px 0 80px}
    .kaffee-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .kaffee-card{margin:0;background:#fff;border:1px solid rgba(3,63,44,.1);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(3,63,44,.07)}
    .kaffee-card button{display:block;width:100%;border:0;padding:0;background:#edf3ee;cursor:zoom-in}
    .sprite-view{width:100%;aspect-ratio:1/1;background-image:url('../assets/kaffee/kaffee-sprite.webp');background-size:300% 300%;background-repeat:no-repeat;background-color:#f4f5ef}
    .kaffee-card figcaption{padding:14px 16px 16px;font-weight:780;color:#123e31}
    .kaffee-card:hover{transform:translateY(-3px);transition:.18s ease;box-shadow:0 16px 38px rgba(3,63,44,.12)}
    .p1{background-position:0% 0%}.p2{background-position:50% 0%}.p3{background-position:100% 0%}
    .p4{background-position:0% 50%}.p5{background-position:50% 50%}.p6{background-position:100% 50%}
    .p7{background-position:0% 100%}.p8{background-position:50% 100%}.p9{background-position:100% 100%}
    .lightbox{position:fixed;inset:0;z-index:9999;display:none;place-items:center;background:rgba(0,20,13,.94);padding:28px}
    .lightbox.open{display:grid}
    .lightbox-art{width:min(90vw,900px);aspect-ratio:1/1;background-image:url('../assets/kaffee/kaffee-sprite.webp');background-size:300% 300%;background-repeat:no-repeat;background-color:#f4f5ef;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .lightbox-close{position:fixed;top:18px;right:22px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font-size:30px;cursor:pointer}
    @media(max-width:900px){.kaffee-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:580px){.kaffee-grid{grid-template-columns:1fr}.kaffee-hero{padding-top:42px}}
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav shell" aria-label="Primary navigation">
      <a class="brand" href="../" aria-label="Neckermann Strom home"><img src="../assets/neckermann-strom-logo.webp" alt="Neckermann Strom"></a>
      <div class="nav-links"><a href="../">Brand Hub</a><a href="../footer/">Footer Gallery</a><a href="../contest/">Contest Planning</a><a href="../instant-winner/">Instant Winner</a><a href="./" aria-current="page">Kaffee</a></div>
    </nav>
  </header>
  <main>
    <section class="kaffee-hero">
      <div class="shell">
        <div class="kicker">Neckermann Strom Creative Library</div>
        <h1>Kaffee</h1>
        <p>Private-Label-Kaffee, Verpackungsrichtungen und Messestand-Präsentationen für Neckermann Strom. Bild anklicken, um die Vollansicht zu öffnen.</p>
      </div>
    </section>
    <section class="kaffee-gallery shell">
      <div class="kaffee-grid">
        <figure class="kaffee-card"><button type="button" data-pos="p1" aria-label="Kaffee-Konzept Übersicht vergrößern"><div class="sprite-view p1" role="img" aria-label="Kaffee-Konzept Übersicht"></div></button><figcaption>Kaffee-Konzept Übersicht</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p2" aria-label="Feine Crema vergrößern"><div class="sprite-view p2" role="img" aria-label="Feine Crema"></div></button><figcaption>Feine Crema</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p3" aria-label="Büro Mischung vergrößern"><div class="sprite-view p3" role="img" aria-label="Büro Mischung"></div></button><figcaption>Büro Mischung</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p4" aria-label="Privatlabel Kaffee vergrößern"><div class="sprite-view p4" role="img" aria-label="Privatlabel Kaffee"></div></button><figcaption>Privatlabel Kaffee</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p5" aria-label="Hausmischung vergrößern"><div class="sprite-view p5" role="img" aria-label="Hausmischung"></div></button><figcaption>Hausmischung</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p6" aria-label="Espresso Mischung vergrößern"><div class="sprite-view p6" role="img" aria-label="Espresso Mischung"></div></button><figcaption>Espresso Mischung</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p7" aria-label="Messestand Galerie 01 vergrößern"><div class="sprite-view p7" role="img" aria-label="Messestand Galerie 01"></div></button><figcaption>Messestand Galerie 01</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p8" aria-label="Messestand Galerie 02 vergrößern"><div class="sprite-view p8" role="img" aria-label="Messestand Galerie 02"></div></button><figcaption>Messestand Galerie 02</figcaption></figure>
        <figure class="kaffee-card"><button type="button" data-pos="p9" aria-label="Messestand Galerie 03 vergrößern"><div class="sprite-view p9" role="img" aria-label="Messestand Galerie 03"></div></button><figcaption>Messestand Galerie 03</figcaption></figure>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="footer-row shell"><strong>Neckermann Strom</strong><span>Internal brand resource</span></div></footer>
  <div class="lightbox" id="kaffee-lightbox" role="dialog" aria-modal="true" aria-label="Bildansicht"><button class="lightbox-close" type="button" aria-label="Schließen">×</button><div class="lightbox-art" role="img" aria-label="Vergrößerte Kaffee-Ansicht"></div></div>
  <script>
    const lb=document.getElementById('kaffee-lightbox'),art=lb.querySelector('.lightbox-art');
    document.querySelectorAll('[data-pos]').forEach(b=>b.addEventListener('click',()=>{art.className='lightbox-art '+b.dataset.pos;lb.classList.add('open');document.body.style.overflow='hidden'}));
    function closeLB(){lb.classList.remove('open');art.className='lightbox-art';document.body.style.overflow=''}
    lb.querySelector('.lightbox-close').addEventListener('click',closeLB);
    lb.addEventListener('click',e=>{if(e.target===lb)closeLB()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB()});
  </script>
</body>
</html>
